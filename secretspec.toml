[project]
name = "backend-go"
revision = "1.0"

[profiles.default]
APP_ENV = { description = "Application environment", default = "development" }
APP_PORT = { description = "Go HTTP server port", default = "3000" }
IS_HTTPS = { description = "Enable Secure cookies (required in production)", default = "false" }
FRONTEND_URL = { description = "Frontend URL to redirect after OAuth login/logout (optional)", default = "" }

GITHUB_CLIENT_ID = { description = "GitHub OAuth client ID" }
GITHUB_CLIENT_SECRET = { description = "GitHub OAuth client secret", required = true }
GITHUB_REDIRECT_URL = { description = "GitHub OAuth callback URL", default = "http://localhost:3000/api/auth/oauth/github/callback" }

DB_HOST = { description = "PostgreSQL host (use 'postgres' in Docker)", default = "localhost" }
DB_PORT = { description = "PostgreSQL port", default = "5432" }
DB_USER = { description = "Database username", required = true }
DB_PASSWORD = { description = "Database password", required = true }
DB_NAME = { description = "Database name", required = true }
DB_SSLMODE = { description = "PostgreSQL SSL mode", default = "disable" }

SESSION_COOKIE_NAME = { description = "Session cookie name", default = "session_id" }
SESSION_DURATION = { description = "Active session duration", default = "24h" }
PASSWORD_COST = { description = "Bcrypt hashing cost", default = "10" }

[profiles.production]
APP_ENV = { default = "production" }
DB_SSLMODE = { required = true }
DB_PASSWORD = { required = true }
