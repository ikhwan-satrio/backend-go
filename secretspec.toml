[project]
name = "backend-go"
revision = "1.0"

[profiles.default]
APP_ENV = { description = "Environment aplikasi", default = "development" }
APP_PORT = { description = "Port HTTP server Go", default = "3000" }

DB_HOST = { description = "Host PostgreSQL (gunakan 'postgres' di Docker)", default = "localhost" }
DB_PORT = { description = "Port PostgreSQL", default = "5432" }
DB_USER = { description = "Username database", required = true, default = "postgres" }
DB_PASSWORD = { description = "Password database", required = true }
DB_NAME = { description = "Nama database", required = true, default = "backend-go_db" }
DB_SSLMODE = { description = "Mode SSL PostgreSQL", default = "disable" }
DATABASE_URL = { description = "Connection string lengkap (opsional)" }

SESSION_COOKIE_NAME = { description = "Nama cookie session", default = "session_id" }
SESSION_DURATION = { description = "Durasi session aktif", default = "24h" }
PASSWORD_COST = { description = "Bcrypt hashing cost", default = "10" }

[profiles.production]
APP_ENV = { default = "production" }
DB_SSLMODE = { required = true, default = "require" }
DB_PASSWORD = { required = true }
